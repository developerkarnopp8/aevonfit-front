@if (visible()) {
  <div class="flex items-center gap-3 px-4 py-2.5 bg-surface-container border-b border-outline-variant/10 animate-fade-in">
    <span class="material-symbols-outlined text-primary-fixed text-[18px] flex-shrink-0">notifications_active</span>
    <p class="flex-1 text-on-surface-variant text-xs">
      Ative as notificações do navegador pra saber na hora quando chegar uma mensagem nova.
    </p>
    <button type="button" (click)="enable()"
      class="px-3 py-1.5 rounded-sm bg-primary-fixed text-on-primary-fixed font-headline font-bold text-[11px] uppercase tracking-wider flex-shrink-0 transition-all active:scale-95">
      Ativar
    </button>
    <button type="button" (click)="dismiss()" aria-label="Fechar aviso"
      class="w-7 h-7 rounded-sm flex items-center justify-center text-outline hover:text-on-surface transition-colors flex-shrink-0">
      <span class="material-symbols-outlined text-[16px]">close</span>
    </button>
  </div>
}
